name: CodeQL

on:
  push:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  pull_request:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  workflow_dispatch:

jobs:
  analyze-python:
    name: Analyze (python)
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:python"

  analyze-cpp:
    name: Analyze (cpp)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      options: --init
    # Source-built protoc and Protobuf add to the full traced C++ build.
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates git lua5.4 python3 tar

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Git for the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the tool-preparation tracing boundary
        run: lua5.4 .github/codeql/test-preparation-tracing.lua

      # Initialize tracing before any Bazel process starts.
      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        env:
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            {"database":{"init":["--extra-tracing-config=.github/codeql/sai-preparation-tracing.lua"]}}
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: cpp
          build-mode: manual
          trap-caching: false
          dependency-caching: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          cache-version: "8.5.1"

      - name: Select and record the maintained registry revision
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          import re
          import subprocess
          main = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/main"
          ref = "refs/heads/main"
          advertised = subprocess.check_output(["git", "ls-remote",
              "https://github.com/securely1g/sonic-bazel-registry.git", ref], text=True).split()
          assert len(advertised) == 2 and advertised[1] == ref
          revision = advertised[0]
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          registry = main
          configuration = Path(".bazelrc").read_text()
          assert configuration.count(main) == 1
          artifacts = Path("artifacts/validation").resolve()
          artifacts.mkdir(parents=True, exist_ok=True)
          (artifacts / "declared.bazelrc").write_text(configuration)
          effective = artifacts / "effective.bazelrc"
          effective.write_text(configuration)
          (artifacts / "registry-inputs.json").write_text(json.dumps({
              "declared_registry": main, "registry": registry,
              "observed_revision": revision, "draft_validation": False,
          }, indent=2) + "\n")
          PYTHON

      - name: Verify Rust source inputs
        run: |
          test ! -e Cargo.Bazel.lock
          git ls-files --error-unmatch Cargo.lock

      - name: Build production programs and selected C++ coverage targets
        run: >-
          python3 bazel/ci_production.py build
          --architecture amd64
          --artifact-directory artifacts/codeql
          --mode codeql

      - name: Retain Rust dependency evidence
        run: |
          test ! -e Cargo.Bazel.lock
          git diff --exit-code HEAD -- Cargo.lock
          mkdir -p artifacts/rust
          cp Cargo.toml Cargo.lock MODULE.bazel.lock artifacts/rust/

      - name: Upload Rust dependency evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-rust-metadata-codeql
          path: artifacts/rust/
          if-no-files-found: error

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:cpp"
          upload-database: false

      - name: Verify selected C++ source extraction
        shell: bash
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
          CODEQL_DATABASES: ${{ steps.analyze.outputs.db-locations }}
        run: |
          codeql_database="$(python3 -c 'import json, os; print(json.loads(os.environ["CODEQL_DATABASES"])["cpp"])')"
          "$CODEQL" pack install .github/codeql/coverage
          "$CODEQL" query run \
            --database="$codeql_database" \
            --output="$RUNNER_TEMP/swss-cpp-files.bqrs" \
            .github/codeql/coverage/CppSourceFiles.ql
          "$CODEQL" bqrs decode \
            --format=csv \
            --output=artifacts/codeql/cpp-source-files.csv \
            "$RUNNER_TEMP/swss-cpp-files.bqrs"
          python3 bazel/ci_production.py check-codeql \
            --build-receipt artifacts/codeql/manifest.json \
            --csv artifacts/codeql/cpp-source-files.csv \
            --output artifacts/codeql/source-coverage.json

      - name: Upload C++ extraction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-codeql-cpp
          path: artifacts/codeql/
          if-no-files-found: error

      - name: Upload registry selection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-registry-codeql
          path: artifacts/validation/
          if-no-files-found: warn

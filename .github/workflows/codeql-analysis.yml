name: CodeQL

on:
  push:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  pull_request:
    branches:
      - 'master'
      - 'bazel-bzlmod'
      - '202[0-9][0-9][0-9]'
  workflow_dispatch:

jobs:
  analyze-python:
    name: Analyze (python)
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:python"

  analyze-cpp:
    name: Analyze (cpp)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      options: --init
    # Source-built protoc and Protobuf add to the full traced C++ build.
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates git lua5.4 python3 tar

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Git for the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the tool-preparation tracing boundary
        run: lua5.4 .github/codeql/test-preparation-tracing.lua

      # Initialize tracing before any Bazel process starts.
      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        env:
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            {"database":{"init":["--extra-tracing-config=.github/codeql/sai-preparation-tracing.lua"]}}
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: cpp
          build-mode: manual
          trap-caching: false
          dependency-caching: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          cache-version: "8.5.1"

      - name: Prepare Rust metadata from the tracked Cargo lock
        run: |
          python3 tools/bazel/prepare_rust.py --receipt artifacts/rust/preparation.json
          git ls-files --error-unmatch Cargo.lock
          git diff --exit-code -- Cargo.lock
          test -z "$(git ls-files Cargo.Bazel.lock)"
          git check-ignore Cargo.Bazel.lock
          cp Cargo.lock Cargo.Bazel.lock MODULE.bazel.lock artifacts/rust/
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          import shutil
          receipt = json.loads(Path("artifacts/rust/preparation.json").read_text())
          for dependency in receipt["dependencies"]:
              directory = Path("artifacts/rust/common")
              directory.mkdir(parents=True, exist_ok=True)
              workspace = Path(dependency["workspace"])
              for name in ("Cargo.lock", "Cargo.Bazel.lock", "MODULE.bazel.lock", "preparation.json", "source-resolution.json"):
                  shutil.copy2(workspace / name, directory / name)
          PYTHON

      - name: Upload Rust preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-rust-metadata-codeql
          path: artifacts/rust/
          if-no-files-found: error

      - name: Build production programs and selected C++ coverage targets
        run: >-
          python3 bazel/ci_production.py build
          --architecture amd64
          --artifact-directory artifacts/codeql
          --mode codeql

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:cpp"
          upload-database: false

      - name: Verify selected C++ source extraction
        shell: bash
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
          CODEQL_DATABASES: ${{ steps.analyze.outputs.db-locations }}
        run: |
          codeql_database="$(python3 -c 'import json, os; print(json.loads(os.environ["CODEQL_DATABASES"])["cpp"])')"
          "$CODEQL" pack install .github/codeql/coverage
          "$CODEQL" query run \
            --database="$codeql_database" \
            --output="$RUNNER_TEMP/swss-cpp-files.bqrs" \
            .github/codeql/coverage/CppSourceFiles.ql
          "$CODEQL" bqrs decode \
            --format=csv \
            --output=artifacts/codeql/cpp-source-files.csv \
            "$RUNNER_TEMP/swss-cpp-files.bqrs"
          python3 bazel/ci_production.py check-codeql \
            --build-receipt artifacts/codeql/manifest.json \
            --csv artifacts/codeql/cpp-source-files.csv \
            --output artifacts/codeql/source-coverage.json

      - name: Upload C++ extraction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-codeql-cpp
          path: artifacts/codeql/
          if-no-files-found: error
